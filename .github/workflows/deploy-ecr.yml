name: Build and Push to ECR

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: itzg/minecraft-server

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          # Build the Docker image using docker compose
          docker build -t itzg/minecraft-server:stable .
          
          # The image will be tagged as specified in docker-compose.yml (itzg/minecraft-server:stable)
          # Tag it for ECR
          docker tag itzg/minecraft-server:stable 545122900000.dkr.ecr.us-east-1.amazonaws.com/itzg/minecraft-server:latest
          
          # Push both tags
          docker push 545122900000.dkr.ecr.us-east-1.amazonaws.com/itzg/minecraft-server:latest
      - name: Output image URI
        run: |
          echo "Image pushed to: ${{ steps.build-image.outputs.image }}"

